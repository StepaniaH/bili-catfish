<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>Bili Catfish - 管理屏蔽列表</title>
  <link rel="stylesheet" href="options.css" />
</head>
<body>
  <header>
    <h1>Bili Catfish</h1>
    <span id="bcf-count"></span>
    <span id="bcf-status" class="bcf-status-text"></span>
  </header>

  <section class="bcf-section">
    <div class="bcf-section-label">开关</div>
    <div class="bcf-switch-grid">
      <label><input type="checkbox" id="bcf-block-ads" /> 屏蔽广告</label>
      <label><input type="checkbox" id="bcf-block-promos" /> 屏蔽推广</label>
      <label><input type="checkbox" id="bcf-paused" /> 暂停插件</label>
    </div>
  </section>

  <section class="bcf-section">
    <div class="bcf-section-head">
      <span class="bcf-section-label">分类卡片屏蔽</span>
      <span class="bcf-section-note">角标精确匹配 · 命中即打码</span>
    </div>
    <div id="bcf-categories" class="bcf-category-grid"></div>
  </section>

  <section class="bcf-section">
    <div class="bcf-section-head">
      <span class="bcf-section-label">已屏蔽视频</span>
    </div>
    <div id="bcf-videos"></div>
  </section>

  <section class="bcf-section">
    <div class="bcf-section-head">
      <span class="bcf-section-label">已屏蔽 UP 主</span>
    </div>
    <div id="bcf-upers"></div>
  </section>

  <section class="bcf-section">
    <div class="bcf-section-label">数据</div>
    <div class="bcf-actions-row">
      <button id="bcf-export">导出屏蔽列表</button>
      <label class="bcf-file-label">导入屏蔽列表<input type="file" id="bcf-import-file" accept="application/json,.json" /></label>
      <button id="bcf-clear" class="bcf-danger">清空所有屏蔽记录</button>
    </div>
    <p id="bcf-import-result"></p>
  </section>

  <script src="options.js"></script>
</body>
</html>
