name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify tag matches versions
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          MANIFEST=$(node -p "require('./manifest.json').version")
          PKG=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$MANIFEST" ] || [ "$TAG" != "$PKG" ]; then
            echo "tag v$TAG does not match manifest $MANIFEST / package $PKG"
            exit 1
          fi

      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run typecheck
      - run: npm run pack

      - name: Upload to Chrome Web Store and submit for review
        env:
          CWS_JSON: ${{ secrets.CWS_SERVICE_ACCOUNT_JSON }}
          CWS_KEY_FILE: /tmp/cws-service-account.json
          CWS_PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
          CWS_EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
        run: |
          printf '%s' "$CWS_JSON" > "$CWS_KEY_FILE"
          node .github/scripts/cws-publish.mjs upload release/*.zip
          node .github/scripts/cws-publish.mjs publish

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.zip
